name: Build Windows x64 (Explorer UI + Bruteforcer UI/Console)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:   # Permite ejecutarlo manualmente desde la pestaña Actions

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      # ---------- Bruteforcer UI ----------
      - name: Publish Bruteforcer UI (Windows x64 self-contained)
        run: >
          dotnet publish Bruteforcer/UI/PCKBruteforcer.UI.csproj
          -c Release
          -r win-x64
          --self-contained false
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o ./publish/bruteforcer-ui-win-x64

      # ---------- Bruteforcer Console ----------
      - name: Publish Bruteforcer Console (Windows x64 self-contained)
        run: >
          dotnet publish Bruteforcer/Console/PCKBruteforcer.Console.csproj
          -c Release
          -r win-x64
          --self-contained false
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o ./publish/bruteforcer-console-win-x64

      # ---------- Upload artifacts ----------
      - name: Upload GodotPCKExplorer UI
        uses: actions/upload-artifact@v4
        with:
          name: GodotPCKExplorer-UI-win-x64
          path: ./publish/explorer-ui-win-x64

      - name: Upload Bruteforcer UI
        uses: actions/upload-artifact@v4
        with:
          name: PCKBruteforcer-UI-win-x64
          path: ./publish/bruteforcer-ui-win-x64

      - name: Upload Bruteforcer Console
        uses: actions/upload-artifact@v4
        with:
          name: PCKBruteforcer-Console-win-x64
          path: ./publish/bruteforcer-console-win-x64
